# Paths that decide whether #RunCheck runs the iOS debug build (CA-1240).
# Format: "ios <pattern>" or "other <pattern>". The first matching line wins,
# and "ios" lines come first. A pattern ending in "/" matches a directory
# prefix. Any other pattern is a shell glob matched against the whole path.
# A file that matches no line is treated as not iOS-related. The "other" lines
# exist so that scripts/ci/ios_build_needed_test.sh can fail when a new
# top-level path has not been classified.

ios ios/
ios pubspec.yaml
ios pubspec.lock
ios pubspec_overrides.yaml
ios .fvmrc
ios codemagic.yaml
ios .github/workflows/run_c_check.yml
ios assets/
ios config/
ios scripts/ci/
ios l10n.yaml
ios build.yaml
ios flutter_launcher_icons-*.yaml

other .claude/
other .cursor/
other .github/
other android/
other docs/
other integration_test/
other lib/
other scripts/
other skills/
other test/
other test_driver/
other .dockerignore
other .gitattributes
other .gitignore
other .metadata
other Dockerfile
other README.md
other analysis_options.yaml
other custom_lint.yaml
other docker-compose.yml
