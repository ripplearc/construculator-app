name: Nightly iOS Debug Build
on:
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print the Codemagic request instead of sending it."
        type: boolean
        default: true

permissions:
  contents: read
  checks: read

jobs:
  nightly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/ci
          persist-credentials: false

      - name: Decide whether main needs an iOS build
        id: decide
        env:
          GH_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DECISION=$(bash scripts/ci/main_needs_ios_build.sh)
          echo "decision=$DECISION" >> "$GITHUB_OUTPUT"
          echo "Decision: $DECISION" >> "$GITHUB_STEP_SUMMARY"

      - name: Start iOS Debug Build on main
        if: steps.decide.outputs.decision == 'build'
        env:
          CODEMAGIC_API_TOKEN: ${{ secrets.CODEMAGIC_API_TOKEN }}
          CODEMAGIC_APP_ID: ${{ secrets.CODEMAGIC_APP_ID }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: bash scripts/ci/trigger_codemagic_builds.sh main ios-debug-build
