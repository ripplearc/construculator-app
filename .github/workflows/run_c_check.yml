name: Trigger Comprehensive Check
on:
  issue_comment:
    types: [created, edited]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull request whose branch the builds are started for."
        required: true
      dry_run:
        description: "Print the Codemagic requests instead of sending them."
        type: boolean
        default: true

permissions:
  contents: read
  pull-requests: read

jobs:
  trigger:
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue.pull_request &&
       contains(github.event.comment.body, '#RunCheck'))
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/ci
          persist-credentials: false

      - name: Extract PR Source Branch
        id: extract-branch
        env:
          PR_NUMBER: ${{ github.event.issue.number || inputs.pr_number }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_JSON=$(curl -sS --fail-with-body \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/pulls/$PR_NUMBER")
          BRANCH_NAME=$(jq -er '.head.ref' <<< "$PR_JSON")
          echo "BRANCH: $BRANCH_NAME"
          echo "branch_name=$BRANCH_NAME" >> "$GITHUB_OUTPUT"

      - name: Start Codemagic builds on Source Branch
        env:
          BRANCH_NAME: ${{ steps.extract-branch.outputs.branch_name }}
          CODEMAGIC_API_TOKEN: ${{ secrets.CODEMAGIC_API_TOKEN }}
          CODEMAGIC_APP_ID: ${{ secrets.CODEMAGIC_APP_ID }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          bash scripts/ci/trigger_codemagic_builds.sh "$BRANCH_NAME" \
            pre-check comprehensive-check ios-debug-build
